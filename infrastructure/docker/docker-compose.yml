version: "3.9"

services:

  backend:

    build: ./backend

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - redis

  postgres:

    image: postgres:16

    environment:

      POSTGRES_DB: traffic

      POSTGRES_USER: admin

      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

  redis:

    image: redis:7

    ports:
      - "6379:6379"